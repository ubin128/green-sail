<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>친환경 생활 습관 챌린지</title>

  <!-- ✅ 나눔스퀘어 폰트 -->
  <style>
    @font-face{
      font-family:'NanumSquare';
      src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2107@1.1/NanumSquare-Regular.woff') format('woff');
      font-weight:400; font-style:normal;
    }
    @font-face{
      font-family:'NanumSquare';
      src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2107@1.1/NanumSquare-Bold.woff') format('woff');
      font-weight:700; font-style:normal;
    }
  </style>

  <style>
    :root{
      --deep1:#041421;
      --deep2:#062238;
      --deep3:#0a2f4e;
      --ink:#eaf6ff;
      --accent:#3bd1c6;
    }
    *{box-sizing:border-box}
    body{
      margin:0; font-family:'NanumSquare', sans-serif; color:var(--ink);
      background: radial-gradient(120% 90% at 50% 0%, var(--deep2), var(--deep1) 50%) fixed,
                  linear-gradient(180deg, var(--deep1), var(--deep3)) fixed;
      overflow-x:hidden;
    }

    .wrap{max-width:1100px; margin:0 auto; padding:0 20px}
    .spacer{height:14vh}

    /* 페이드인 */
    .fade{opacity:0; transform:translateY(16px); transition:opacity 1s ease, transform 1s ease}
    .fade.visible{opacity:1; transform:none}

    /* Hero */
    .hero{min-height:100vh; display:flex; align-items:center; position:relative}
    .hero h1{font-size:clamp(28px,5.6vw,64px); margin:0 0 20px; font-weight:700; text-shadow:0 8px 36px rgba(0,0,0,.4)}
    .hero p.sub{font-size:clamp(14px,2.2vw,20px); opacity:.9}

    /* 보트 */
    .boat{
      position:fixed; left:calc(55% + 240px); top:24vh;
      width:84px; transform:translateX(-50%) rotate(0deg);
      transform-origin:center center;
      transition:opacity 1.5s ease;  /* 초기엔 투명도만 */
      filter:drop-shadow(0 12px 30px rgba(0,0,0,.45));
      opacity:0; z-index:10;
    }
    .boat img{width:100%}

    /* 섬 */
    .island{min-height:80vh; display:flex; align-items:center}
    .card{
      background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14);
      padding:22px 18px; border-radius:16px; backdrop-filter:blur(6px);
      box-shadow:0 10px 40px rgba(0,0,0,.35); max-width:560px;
    }
    .chip{display:inline-block; padding:6px 12px; border-radius:999px; font-weight:700;
      background:rgba(59,209,198,.18); border:1px solid rgba(59,209,198,.4); margin-bottom:10px}
    .island h2{margin:6px 0 8px; font-size:clamp(22px,4.2vw,36px)}

    .isle-mark{
      width:92px; height:92px; border-radius:18px;
      background:linear-gradient(180deg,#99f2c8,#1f8a70);
      border:2px solid rgba(255,255,255,.4);
      box-shadow:0 8px 30px rgba(0,0,0,.35);
      display:flex; align-items:center; justify-content:center;
      margin-bottom:12px; overflow:hidden;
      opacity:0; transform:translateY(14px);
      transition:opacity .9s ease, transform .9s ease;
    }
    .isle-mark.visible{opacity:1; transform:none}

    .btn{display:inline-block; margin-top:6px;
      background:linear-gradient(90deg,#3bd1c6,#7ee8de);
      color:#063346; text-decoration:none; font-weight:700;
      padding:12px 16px; border-radius:12px; box-shadow:0 8px 24px rgba(59,209,198,.25)}
    .btn:hover{filter:brightness(1.05)}

    .footer{height:16vh}
  </style>
</head>
<body>

  <!-- Hero -->
  <section class="hero wrap">
    <div>
      <h1 class="fade" id="title">작은 습관이<br>우리의 <span style="color:#7ee8de">항로</span>를 바꾼다</h1>
      <p class="sub fade" id="subtitle">친환경 실천이 모이면, 우리 반의 항로가 보입니다.<br>아래로 스크롤해 항해를 시작하세요.</p>
    </div>
  </section>

  <!-- 보트 -->
  <div id="boat" class="boat">
    <img src="ship-yacht.svg" alt="보트">
  </div>

  <div class="spacer"></div>

  <!-- 섬 1 -->
  <section class="island wrap" id="isle-log">
    <div class="card fade">
      <div class="isle-mark" id="mark-log">
        <span style="font-size:30px">🏝️</span>
      </div>
      <span class="chip">첫 번째 섬</span>
      <h2>오늘의 기록</h2>
      <p>오늘 실천한 항목을 간단히 체크하고 저장하세요.</p>
      <a href="log.html" class="btn">기록하기</a>
    </div>
  </section>

  <div class="spacer"></div>

  <!-- 섬 2 -->
  <section class="island wrap" id="isle-board">
    <div class="card fade">
      <div class="isle-mark" id="mark-board"><span style="font-size:30px">🏝️</span></div>
      <span class="chip">두 번째 섬</span>
      <h2>함대 현황판</h2>
      <p>반별 평균 달성률로 비교합니다. 모두의 항해가 모여 학교의 항로가 됩니다.</p>
      <a href="board.html" class="btn">현황판 보기</a>
    </div>
  </section>

  <div class="footer"></div>

  <script>
    // 페이드인/아웃
    const io = new IntersectionObserver((entries)=>{
      entries.forEach(entry=>{
        if(entry.isIntersecting){
          entry.target.classList.add('visible');
        } else {
          entry.target.classList.remove('visible');
        }
      });
    }, {threshold:0.25});
    document.querySelectorAll('.fade, .isle-mark').forEach(n=>io.observe(n));

    // 초기 순차 등장
    window.addEventListener('load', ()=>{
      const boat = document.getElementById('boat');
      document.getElementById('title').classList.add('visible');
      setTimeout(()=>document.getElementById('subtitle').classList.add('visible'), 300);

      // 보트 1단계: 페이드인
      setTimeout(()=> {
        boat.style.opacity = 1;
      }, 500);

      // 보트 2단계: 회전 (천천히 2초 동안)
      setTimeout(()=> {
        boat.style.transition = "transform 2s ease";
        boat.style.transform = "translateX(-20%) rotate(90deg)";
      }, 1500);
    });

    // 스크롤 시 보트 하강
    window.addEventListener('scroll', ()=>{
      const boat = document.getElementById('boat');
      const scrollTop = window.scrollY;
      const docHeight = document.body.scrollHeight - window.innerHeight;
      const pct = scrollTop / docHeight;
      const minY = window.innerHeight * 0.24;
      const maxY = window.innerHeight * 0.72;
      boat.style.top = (minY + (maxY-minY)*pct) + "px";
    });
  </script>
</body>
</html>
