<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>오늘의 기록 · 친환경 생활 습관 챌린지</title>
    
    <style>
        :root{
            --bg1:#eaf4ff;
            --bg2:#fff3e6;
            --panel:#ffffffcc;
            --ink:#222;
            --muted:#666;
            --accent:#3b82f6;
        }
        body{
            margin:0; padding:24px;
            min-height:100vh;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans", sans-serif;
            color:var(--ink);
            background:
                radial-gradient(1200px 1200px at 10% -10%, var(--bg1), transparent 45%),
                radial-gradient(1100px 1100px at 110% 5%, var(--bg2), transparent 45%),
                linear-gradient(180deg, #f8fbff 0%, #f6f6ff 100%);
            background-attachment: fixed;
        }
        .container {
            max-width: 800px; /* log.html에 맞는 너비로 조절 */
            margin: 0 auto;
            padding: 24px 24px 32px;
            background: var(--panel);
            backdrop-filter: blur(6px);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08), 0 2px 8px rgba(0,0,0,0.06);
        }
        h1{
            margin: 4px 0 8px; font-size: 28px; font-weight: 800;
            letter-spacing: -0.3px; display:flex; align-items:center; gap:8px;
        }
        p.sub { color: var(--muted); margin-bottom: 24px; }
        .datebox {
            font-size: 16px; font-weight: 600; color: var(--ink);
            background: rgba(59,130,246,.08); padding: 10px 14px;
            border-radius: 8px; margin-bottom: 24px; text-align: center;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }
        /* 화면이 넓어지면 2열로 변경 */
        @media (min-width: 640px) {
            .grid { grid-template-columns: 1fr 1fr; }
        }
        .card {
            background: #fff; border: 1px solid #e5e7eb; border-radius: 12px;
            padding: 16px; box-shadow: 0 3px 8px rgba(0,0,0,0.04);
        }
        .item { display: flex; align-items: center; gap: 8px; font-weight: 600; }
        .card small { font-size: 13px; color: var(--muted); margin-top: 4px; display: block; }
        input[type="checkbox"] { width: 18px; height: 18px; }

        .total {
            display: flex; justify-content: space-between; align-items: baseline;
            margin-top: 24px; padding: 16px; background: #f9fafb;
            border-radius: 10px; font-size: 18px;
        }
        .total strong { font-size: 24px; font-weight: 800; color: var(--accent); }

        .actions { display:flex; gap:12px; margin-top: 20px; flex-wrap:wrap; }
        .actions .btn{
            padding:12px 16px; border-radius:10px; border:none; outline:none;
            background: var(--accent); color:white; font-size: 16px; font-weight: 700;
            cursor:pointer; transition: transform .1s ease;
            box-shadow: 0 4px 14px rgba(59,130,246,.25);
        }
        .actions .btn:hover{ transform: translateY(-2px); }
        .actions .btn.secondary { background: #e5e7eb; color: #374151; box-shadow: none;}

        .note { font-size: 13px; color: var(--muted); margin-top: 16px; }
        .success {
            margin-top: 12px; padding: 12px; border-radius: 8px; background: #dbeafe;
            color: #1e40af; font-weight: 600; text-align: center;
            opacity: 0; transition: opacity .3s ease;
        }
        .success.show { opacity: 1; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .brand { font-size: 20px; font-weight: 800; }
        .btn-link { 
            text-decoration: none; color: var(--accent); font-weight: 600;
            padding: 8px 12px; border-radius: 8px; transition: background-color .2s ease;
        }
        .btn-link:hover { background-color: rgba(59,130,246,.1); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="brand">🌿 초록돛단배</div>
            <a class="btn-link" href="index.html">← 홈으로</a>
        </header>

        <h1>오늘의 기록</h1>
        <p class="sub">체크한 항목만큼 오늘의 탄소 절감량(kg CO₂)을 계산해 저장해요.</p>

        <div class="datebox">
            <span id="todayStr"></span>
        </div>

        <div class="grid" id="list">
            <div class="card">
                <div class="item">
                    <input id="c_light" type="checkbox" data-kg="0.05">
                    <label for="c_light">불필요한 전등 끄기</label>
                </div>
                <small>빈 교실·집에서 전등 바로 끄기 (≈ 0.05 kg)</small>
            </div>
            <div class="card">
                <div class="item">
                    <input id="c_plug" type="checkbox" data-kg="0.03">
                    <label for="c_plug">사용하지 않는 어댑터/멀티탭 뽑기</label>
                </div>
                <small>대기전력 줄이기 (≈ 0.03 kg)</small>
            </div>
            <div class="card">
                <div class="item">
                    <input id="c_stairs" type="checkbox" data-kg="0.03">
                    <label for="c_stairs">엘리베이터 대신 계단 이용</label>
                </div>
                <small>짧은 층간 이동 대체 (≈ 0.03 kg)</small>
            </div>
            <div class="card">
                <div class="item">
                    <input id="c_transit" type="checkbox" data-kg="0.35">
                    <label for="c_transit">도보/자전거/대중교통 이용</label>
                </div>
                <small>단거리 승용차 대체 (≈ 0.35 kg)</small>
            </div>
            <div class="card">
                <div class="item">
                    <input id="c_tumbler" type="checkbox" data-kg="0.06">
                    <label for="c_tumbler">텀블러/머그 사용</label>
                </div>
                <small>일회용 컵 1개 대체 (≈ 0.06 kg)</small>
            </div>
            <div class="card">
                <div class="item">
                    <input id="c_food" type="checkbox" data-kg="0.12">
                    <label for="c_food">잔반 줄이기</label>
                </div>
                <small>음식물 쓰레기 감축 (≈ 0.12 kg)</small>
            </div>
        </div>

        <div class="total">
            <span>오늘 체크 합계</span>
            <span><strong id="sumKg">0.00</strong> kg CO₂</span>
        </div>

        <div class="actions">
            <button class="btn" id="btnSave">오늘 기록 저장</button>
            <button class="btn secondary" id="btnResetToday">오늘 기록 초기화</button>
        </div>
        <div class="note">※ 가중치(kg)는 프로젝트 예시치입니다. 학교/팀 기준에 맞게 조정하세요.</div>
        <div class="success" id="msg"></div>
    </div>

    <script>
    // --- ⚙️ 캠페인 설정 ---
    const CAMPAIGN_DATES = ['2025-10-13', '2025-10-14', '2025-10-15', '2025-10-16'];
    const CAMPAIGN_TOTAL_KEY = 'gs_campaign_total_saved'; // 전체 누적량을 저장할 키
    // --- ⚙️ 설정 끝 ---

    const todayStrEl = document.getElementById('todayStr');
    const list = document.getElementById('list');
    const sumEl = document.getElementById('sumKg');
    const MSG = document.getElementById('msg');
    
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, '0');
    const d = String(now.getDate()).padStart(2, '0');
    const todayKey = `${y}-${m}-${d}`; // 오늘 날짜 키 (예: 2025-10-21)

    todayStrEl.textContent = `${y}년 ${m}월 ${d}일`;

    // 캠페인 기간인지 확인
    const isCampaignPeriod = CAMPAIGN_DATES.includes(todayKey);

    if (!isCampaignPeriod) {
        document.querySelector('.container').innerHTML += '<div style="background: #ffdddd; color: #d32f2f; padding: 20px; text-align: center; border-radius: 8px; margin-top: 20px; font-weight: bold;">캠페인 진행 기간(10/21 ~ 10/24)이 아닙니다.</div>';
        list.querySelectorAll('input').forEach(input => input.disabled = true);
        document.getElementById('btnSave').disabled = true;
        document.getElementById('btnResetToday').disabled = true;
    }

    // 오늘 날짜의 저장된 값 불러와서 체크박스 복원
    function loadTodayChecks() {
        const savedData = JSON.parse(localStorage.getItem(todayKey) || '{}');
        list.querySelectorAll('input[type="checkbox"]').forEach(ch => {
            if (savedData[ch.id]) {
                ch.checked = true;
            }
        });
        calcSum();
    }

    // 합계 계산 함수
    function calcSum() {
        let sum = 0;
        list.querySelectorAll('input[type="checkbox"]:checked').forEach(ch => {
            sum += parseFloat(ch.dataset.kg || '0');
        });
        sumEl.textContent = sum.toFixed(2);
        return sum;
    }
    list.addEventListener('change', calcSum);

    // 저장 버튼 클릭 시
    document.getElementById('btnSave').addEventListener('click', () => {
        const todaySum = calcSum();
        const checksToSave = {};
        
        // 현재 체크된 항목들만 저장
        list.querySelectorAll('input[type="checkbox"]:checked').forEach(ch => {
            checksToSave[ch.id] = true;
        });
        localStorage.setItem(todayKey, JSON.stringify(checksToSave));

        updateCampaignTotal(); // 전체 누적량 업데이트

        MSG.classList.add('show');
        MSG.textContent = `✅ 저장되었습니다! 오늘 기록: ${todaySum.toFixed(2)} kg CO₂`;
    });
    
    // 초기화 버튼
    document.getElementById('btnResetToday').addEventListener('click', ()=>{
        localStorage.removeItem(todayKey); // 오늘 기록만 삭제
        list.querySelectorAll('input[type="checkbox"]').forEach(ch => ch.checked = false);
        calcSum();
        updateCampaignTotal(); // 전체 누적량 다시 계산
        MSG.classList.add('show');
        MSG.textContent = '♻️ 오늘 기록을 초기화했습니다.';
    });

    // 전체 누적량을 계산하고 저장하는 함수
    function updateCampaignTotal() {
        let totalSaved = 0;
        const allCheckboxes = Array.from(document.querySelectorAll('#list input[type="checkbox"]'));

        CAMPAIGN_DATES.forEach(dateKey => {
            const dayData = JSON.parse(localStorage.getItem(dateKey) || '{}');
            let daySum = 0;
            allCheckboxes.forEach(ch => {
                if (dayData[ch.id]) {
                    daySum += parseFloat(ch.dataset.kg || '0');
                }
            });
            totalSaved += daySum;
        });
        localStorage.setItem(CAMPAIGN_TOTAL_KEY, totalSaved.toString());
    }

    // 페이지 로드 시 오늘 기록 불러오기
    if (isCampaignPeriod) {
        loadTodayChecks();
    }
</script>
</body>
</html>
