<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>오늘의 기록 · 친환경 생활 습관 챌린지</title>
    
    <style>
        :root{
            --bg1:#eaf4ff;
            --bg2:#fff3e6;
            --panel:#ffffffcc;
            --ink:#222;
            --muted:#666;
            --accent:#3b82f6;
        }
        body{
            margin:0; padding:24px;
            min-height:100vh;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans", sans-serif;
            color:var(--ink);
            background:
                radial-gradient(1200px 1200px at 10% -10%, var(--bg1), transparent 45%),
                radial-gradient(1100px 1100px at 110% 5%, var(--bg2), transparent 45%),
                linear-gradient(180deg, #f8fbff 0%, #f6f6ff 100%);
            background-attachment: fixed;
        }
        .container {
            max-width: 800px; /* log.html에 맞는 너비로 조절 */
            margin: 0 auto;
            padding: 24px 24px 32px;
            background: var(--panel);
            backdrop-filter: blur(6px);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08), 0 2px 8px rgba(0,0,0,0.06);
        }
        h1{
            margin: 4px 0 8px; font-size: 28px; font-weight: 800;
            letter-spacing: -0.3px; display:flex; align-items:center; gap:8px;
        }
        p.sub { color: var(--muted); margin-bottom: 24px; }
        .datebox {
            font-size: 16px; font-weight: 600; color: var(--ink);
            background: rgba(59,130,246,.08); padding: 10px 14px;
            border-radius: 8px; margin-bottom: 24px; text-align: center;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }
        /* 화면이 넓어지면 2열로 변경 */
        @media (min-width: 640px) {
            .grid { grid-template-columns: 1fr 1fr; }
        }
        .card {
            background: #fff; border: 1px solid #e5e7eb; border-radius: 12px;
            padding: 16px; box-shadow: 0 3px 8px rgba(0,0,0,0.04);
        }
        .item { display: flex; align-items: center; gap: 8px; font-weight: 600; }
        .card small { font-size: 13px; color: var(--muted); margin-top: 4px; display: block; }
        input[type="checkbox"] { width: 18px; height: 18px; }

        .total {
            display: flex; justify-content: space-between; align-items: baseline;
            margin-top: 24px; padding: 16px; background: #f9fafb;
            border-radius: 10px; font-size: 18px;
        }
        .total strong { font-size: 24px; font-weight: 800; color: var(--accent); }

        .actions { display:flex; gap:12px; margin-top: 20px; flex-wrap:wrap; }
        .actions .btn{
            padding:12px 16px; border-radius:10px; border:none; outline:none;
            background: var(--accent); color:white; font-size: 16px; font-weight: 700;
            cursor:pointer; transition: transform .1s ease;
            box-shadow: 0 4px 14px rgba(59,130,246,.25);
        }
        .actions .btn:hover{ transform: translateY(-2px); }
        .actions .btn.secondary { background: #e5e7eb; color: #374151; box-shadow: none;}

        .note { font-size: 13px; color: var(--muted); margin-top: 16px; }
        .success {
            margin-top: 12px; padding: 12px; border-radius: 8px; background: #dbeafe;
            color: #1e40af; font-weight: 600; text-align: center;
            opacity: 0; transition: opacity .3s ease;
        }
        .success.show { opacity: 1; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .brand { font-size: 20px; font-weight: 800; }
        .btn-link { 
            text-decoration: none; color: var(--accent); font-weight: 600;
            padding: 8px 12px; border-radius: 8px; transition: background-color .2s ease;
        }
        .btn-link:hover { background-color: rgba(59,130,246,.1); }

#past-records-container {
    display: grid;
    gap: 16px; /* 기록 카드 사이의 간격 */
    margin-bottom: 32px; /* '오늘의 기록'과의 간격 */
}

.summary-box {
    background: #f1f5f9; /* 약간 회색빛 배경 */
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 24px;
}
.summary-box h2 {
    margin: 0 0 12px;
    font-size: 18px;
    color: #334155;
    border-bottom: 1px solid #cbd5e1;
    padding-bottom: 8px;
}
.summary-box ul {
    list-style-type: '✔️ ';
    padding-left: 20px;
    margin: 0 0 12px;
    font-size: 15px;
    color: #475569;
}
.summary-box .summary-total {
    font-weight: bold;
    text-align: right;
    font-size: 16px;
    color: var(--accent);
}
.student-input-area {
    display: flex;
    gap: 10px;
    margin-bottom: 24px;
}
.student-input-area input {
    width: 100%;
    padding: 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 16px;
    text-align: center;
}
/* 입력 필드에 포커스될 때 테두리 스타일 */
.student-input-area input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
}
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="brand">🌿 초록돛단배</div>
            <a class="btn-link" href="index.html">← 홈으로</a>
        </header>

        <h1>오늘의 기록</h1>
        <p class="sub">체크한 항목만큼 오늘의 탄소 절감량(kg CO₂)을 계산해 저장해요.</p>

        <div class="datebox">
            <span id="todayStr"></span>
        </div>

        <div class="student-input-area">
            <input type="number" id="studentGrade" placeholder="학년 (예: 1)" min="1" max="2">
            <input type="number" id="studentClass" placeholder="반 (예: 3)" min="1">
            <input type="number" id="studentNumber" placeholder="학번 (예: 15)">
        </div>

        <div class="grid" id="list">
            <div class="card">
                <div class="item">
                    <input id="c_light" type="checkbox" data-kg="0.05">
                    <label for="c_light">불필요한 전등 끄기</label>
                </div>
                <small>빈 교실·집에서 전등 바로 끄기 (≈ 0.05 kg)</small>
            </div>
            <div class="card">
                <div class="item">
                    <input id="c_plug" type="checkbox" data-kg="0.03">
                    <label for="c_plug">사용하지 않는 어댑터/멀티탭 뽑기</label>
                </div>
                <small>대기전력 줄이기 (≈ 0.03 kg)</small>
            </div>
            <div class="card">
                <div class="item">
                    <input id="c_stairs" type="checkbox" data-kg="0.03">
                    <label for="c_stairs">엘리베이터 대신 계단 이용</label>
                </div>
                <small>짧은 층간 이동 대체 (≈ 0.03 kg)</small>
            </div>
            <div class="card">
                <div class="item">
                    <input id="c_transit" type="checkbox" data-kg="0.35">
                    <label for="c_transit">도보/자전거/대중교통 이용</label>
                </div>
                <small>단거리 승용차 대체 (≈ 0.35 kg)</small>
            </div>
            <div class="card">
                <div class="item">
                    <input id="c_tumbler" type="checkbox" data-kg="0.06">
                    <label for="c_tumbler">텀블러/머그 사용</label>
                </div>
                <small>일회용 컵 1개 대체 (≈ 0.06 kg)</small>
            </div>
            <div class="card">
                <div class="item">
                    <input id="c_food" type="checkbox" data-kg="0.12">
                    <label for="c_food">잔반 줄이기</label>
                </div>
                <small>음식물 쓰레기 감축 (≈ 0.12 kg)</small>
            </div>
        </div>

        <div class="total">
            <span>오늘 체크 합계</span>
            <span><strong id="sumKg">0.00</strong> kg CO₂</span>
        </div>

        <div class="actions">
            <button class="btn" id="btnSave">오늘 기록 저장</button>
            <button class="btn secondary" id="btnResetToday">오늘 기록 초기화</button>
        </div>
        <div class="note">※ 가중치(kg)는 프로젝트 예시치입니다. 학교/팀 기준에 맞게 조정하세요.</div>
        <div class="success" id="msg"></div>
        
        <div id="past-records-container">
        </div>

        </div>

       
    
    <script>
    // --- ⚙️ 캠페인 설정 ---
    const CAMPAIGN_DATES = ['2025-10-13', '2025-10-14', '2025-10-15', '2025-10-16'];
    const DB_KEY = 'greenSailData';
    // --- ⚙️ 설정 끝 ---

    const list = document.getElementById('list');
    const sumEl = document.getElementById('sumKg');
    const MSG = document.getElementById('msg');
    const gradeInput = document.getElementById('studentGrade');
    const classInput = document.getElementById('studentClass');
    const numberInput = document.getElementById('studentNumber');
    const pastRecordsContainer = document.getElementById('past-records-container');
    const container = document.querySelector('.container');
    const btnSave = document.getElementById('btnSave');
    const btnResetToday = document.getElementById('btnResetToday');
    
    const now = new Date();
    const todayKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
    document.getElementById('todayStr').textContent = `${now.getFullYear()}년 ${String(now.getMonth() + 1).padStart(2, '0')}월 ${String(now.getDate()).padStart(2, '0')}일`;


   /*  todayStrEl.textContent = `${y}년 ${m}월 ${d}일`; */

    // 캠페인 기간인지 확인
    const isCampaignPeriod = CAMPAIGN_DATES.includes(todayKey);

    if (!isCampaignPeriod) {
        container.innerHTML += '<div style="background: #ffdddd; color: #d32f2f; padding: 20px; text-align: center; border-radius: 8px; margin-top: 20px; font-weight: bold;">캠페인 진행 기간(10/21 ~ 10/24)이 아닙니다.</div>';
        // 모든 입력 필드를 비활성화
        list.querySelectorAll('input').forEach(input => input.disabled = true);
        gradeInput.disabled = true;
        classInput.disabled = true;
        numberInput.disabled = true;
        btnSave.disabled = true;
        btnResetToday.disabled = true;
    }

     // --- ✅ 확인 코드 끝 ---

    // 전체 데이터 가져오기/저장하기
    const getAllData = () => JSON.parse(localStorage.getItem(DB_KEY) || '{}');
    const saveAllData = (data) => localStorage.setItem(DB_KEY, JSON.stringify(data));

    // 학생 정보가 변경될 때마다 실행되는 메인 함수
    function handleStudentInputChange() {
        if (!isCampaignPeriod) return; // 캠페인 기간이 아니면 실행 중단

        const grade = gradeInput.value;
        const cls = classInput.value;
        const num = numberInput.value;

        if (!grade || !cls || !num) {
            list.querySelectorAll('input').forEach(ch => { ch.checked = false; ch.disabled = true; });
            pastRecordsContainer.innerHTML = '<div class="summary-box"><p style="text-align:center; color: var(--muted);">학년, 반, 학번을 모두 입력하면 기록을 조회할 수 있습니다.</p></div>';
            calcSum();
            return;
        }
        
        list.querySelectorAll('input').forEach(ch => ch.disabled = false);
        const studentId = `${grade}-${cls}-${num}`;

        showStudentPastRecords(studentId);
        loadStudentTodayRecord(studentId);
    }


// ✨ '나의 지난 모든 기록'을 보여주는 함수
    function showStudentPastRecords(studentId) {
        const allData = getAllData();
        let pastRecordsHTML = '';

        CAMPAIGN_DATES.forEach(dateKey => {
            if (dateKey < todayKey && allData[dateKey] && allData[dateKey][studentId]) {
                const record = allData[dateKey][studentId];
                let checkedItemsHTML = '<ul>';
                list.querySelectorAll('input[type="checkbox"]').forEach(ch => {
                    if (record.checks.includes(ch.id)) {
                        const label = document.querySelector(`label[for="${ch.id}"]`).textContent;
                        checkedItemsHTML += `<li>${label}</li>`;
                    }
                });
                checkedItemsHTML += '</ul>';
                
                const dateParts = dateKey.split('-');
                pastRecordsHTML += `
                    <div class="summary-box">
                        <h2>${dateParts[1]}/${dateParts[2]} 기록</h2>
                        ${checkedItemsHTML}
                        <div class="summary-total">총 ${record.totalKg.toFixed(2)} kg CO₂ 절감</div>
                    </div>
                `;
            }
        });
        pastRecordsContainer.innerHTML = pastRecordsHTML || '<div class="summary-box"><p style="color: var(--muted);">아직 지난 기록이 없습니다.</p></div>';
    }

    // '나의 오늘 기록'을 불러와 체크박스에 복원하는 함수
    function loadStudentTodayRecord(studentId) {
        const allData = getAllData();
        if (allData[todayKey] && allData[todayKey][studentId]) {
            const savedChecks = allData[todayKey][studentId].checks;
            list.querySelectorAll('input[type="checkbox"]').forEach(ch => {
                ch.checked = savedChecks.includes(ch.id);
            });
            MSG.textContent = `ℹ️ 이전에 저장한 기록을 불러왔습니다.`;
            MSG.classList.add('show');
        } else {
            list.querySelectorAll('input').forEach(ch => ch.checked = false);
            MSG.classList.remove('show');
        }
        calcSum();
    }
    
    // 이벤트 리스너 연결
    gradeInput.addEventListener('input', handleStudentInputChange);
    classInput.addEventListener('input', handleStudentInputChange);
    numberInput.addEventListener('input', handleStudentInputChange);
    list.addEventListener('change', calcSum);

    // 합계 계산 함수
    function calcSum() {
        let sum = 0;
        list.querySelectorAll('input[type="checkbox"]:checked').forEach(ch => {
            sum += parseFloat(ch.dataset.kg || '0');
        });
        sumEl.textContent = sum.toFixed(2);
        return sum;
    }

    // 저장 버튼
    btnSave.addEventListener('click', () => {
        const grade = gradeInput.value;
        const cls = classInput.value;
        const num = numberInput.value;

        if (!grade || !cls || !num) {
            alert('학년, 반, 학번을 모두 입력해주세요.');
            return;
        }

        const studentId = `${grade}-${cls}-${num}`;
        const studentClass = `${grade}-${cls}`;
        const todaySum = calcSum();
        const checkedIds = Array.from(list.querySelectorAll('input[type="checkbox"]:checked')).map(ch => ch.id);

        const record = {
            class: studentClass,
            student: studentId,
            date: todayKey,
            checks: checkedIds,
            totalKg: todaySum,
        };

        const allData = getAllData();
        if (!allData[todayKey]) {
            allData[todayKey] = {};
        }
        allData[todayKey][studentId] = record;
        saveAllData(allData);

        MSG.classList.add('show');
        MSG.textContent = `✅ 저장되었습니다! 오늘 나의 기록: ${todaySum.toFixed(2)} kg CO₂`;
    });
    
    // 초기화 버튼
    btnResetToday.addEventListener('click', () => {
        const grade = gradeInput.value;
        const cls = classInput.value;
        const num = numberInput.value;

        if (!grade || !cls || !num) {
            alert('초기화할 학생의 정보를 먼저 입력해주세요.');
            return;
        }
        const studentId = `${grade}-${cls}-${num}`;
        const allData = getAllData();

        if (allData[todayKey] && allData[todayKey][studentId]) {
            delete allData[todayKey][studentId];
            saveAllData(allData);
            list.querySelectorAll('input').forEach(ch => ch.checked = false);
            calcSum();
            MSG.classList.add('show');
            MSG.textContent = '♻️ 오늘 나의 기록을 초기화했습니다.';
        } else {
            alert('저장된 기록이 없습니다.');
        }
    });

    // 페이지 첫 로드 시 실행
    handleStudentInputChange();
</script>
</body>
</html>
