<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>반별 현황판</title>
  <!-- (선택) 차트 쓰려면 필요 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; padding: 24px; }
    h1 { margin-bottom: 12px; }
    .actions { display: flex; gap: 8px; margin: 16px 0; }
    #log { white-space: pre-wrap; background:#f7f7f7; padding:12px; border-radius:8px; }
  </style>
</head>
<body>
  <h1>반별 현황판</h1>

  <div class="actions">
    <button id="addTest">테스트 데이터 추가</button>
    <button id="loadBtn">데이터 불러오기</button>
  </div>

  <canvas id="myChart" width="600" height="300"></canvas>

  <h3>로그</h3>
  <div id="log">준비됨…</div>

  <!-- 🔸 firebase.js 모듈 불러오기 -->
  <script type="module">
    import { addRecord, getAllRecords } from './firebase.js';

    const log = (...args) => {
      const el = document.getElementById('log');
      el.textContent = args.map(a => (typeof a === 'object' ? JSON.stringify(a, null, 2) : String(a))).join('\n');
      console.log(...args);
    };

    // (선택) 차트 준비
    const ctx = document.getElementById('myChart').getContext('2d');
    const chart = new Chart(ctx, {
      type: 'bar',
      data: { labels: [], datasets: [{ label: '합계(텀블러+소등+제로웨이스트)', data: [] }] },
      options: { responsive: true, scales: { y: { beginAtZero: true } } }
    });

    // 테스트 데이터 추가
    document.getElementById('addTest').addEventListener('click', async () => {
      try {
        const now = new Date().toISOString().slice(0,10); // "YYYY-MM-DD"
        await addRecord({
          date: now,       // 🔺 필드명은 date (data 아님!)
          class: "2-1",
          tumbler: 1,
          lightOff: 1,
          zeroWaste: 0
        });
        log('✅ 테스트 데이터 추가 완료. Firestore 콘솔에서 records 컬렉션 확인하세요.');
      } catch (e) {
        log('❌ 추가 실패:', e.message);
      }
    });

    // 데이터 불러오기
    document.getElementById('loadBtn').addEventListener('click', async () => {
      try {
        const records = await getAllRecords();
        log('✅ 불러오기 성공. 아래는 records 전체:', records);

        // 차트 업데이트 (라벨: 반, 값: 합계)
        const labels = records.map(r => r.class || r.date);
        const values = records.map(r => (r.tumbler||0) + (r.lightOff||0) + (r.zeroWaste||0));
        chart.data.labels = labels;
        chart.data.datasets[0].data = values;
        chart.update();
      } catch (e) {
        log('❌ 불러오기 실패:', e.message);
      }
    });
  </script>
</body>
</html>
