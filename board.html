<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>반별 현황판</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root{
      --bg1:#eaf4ff;
      --bg2:#fff3e6;
      --panel:#ffffffcc;
      --ink:#222;
      --muted:#666;
      --accent:#3b82f6;
    }

    body{
      margin:0; padding:24px;
      min-height:100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans", sans-serif;
      color:var(--ink);
      background:
        radial-gradient(1200px 1200px at 10% -10%, var(--bg1), transparent 45%),
        radial-gradient(1100px 1100px at 110% 5%, var(--bg2), transparent 45%),
        linear-gradient(180deg, #f8fbff 0%, #f6f6ff 100%);
      background-attachment: fixed, fixed, fixed;
    }
    body::before{
      content:"";
      position:fixed; inset:0; pointer-events:none;
      background:
        repeating-linear-gradient(0deg, rgba(0,0,0,0.02) 0 1px, transparent 1px 40px),
        repeating-linear-gradient(90deg, rgba(0,0,0,0.02) 0 1px, transparent 1px 40px);
      mask: linear-gradient(#000, transparent 80%);
    }

    .board{
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 24px 32px;
      background: var(--panel);
      backdrop-filter: blur(6px);
      border-radius: 16px;
      box-shadow:
        0 10px 30px rgba(0,0,0,0.08),
        0 2px 8px rgba(0,0,0,0.06);
    }

    h1{
      margin: 4px 0 12px;
      font-size: 28px; font-weight: 800;
      letter-spacing: -0.3px;
      display:flex; align-items:center; gap:8px;
    }
    h1::after{
      content:"";
      flex:1; height:2px;
      background: linear-gradient(90deg, var(--accent), transparent);
      border-radius:2px;
    }

    .actions{ display:flex; gap:8px; margin:16px 0; flex-wrap:wrap; }
    .actions input, .actions button, .actions select{
      padding:10px 12px; border-radius:10px; border:1px solid #e5e7eb; outline:none;
      background:#fff; color:#111;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }
    .actions button{
      background: var(--accent); color:white; border:none;
      cursor:pointer; transition: transform .04s ease, box-shadow .2s ease;
      box-shadow: 0 4px 14px rgba(59,130,246,.25);
    }
    .actions button:hover{ transform: translateY(-1px); }
    .actions button:active{ transform: translateY(0); }

    #chart1, #chart2{
      background:#fff; border-radius:14px; padding:8px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.06);
      max-width:100%; height:auto; display:block;
    }

    table{ width:100%; margin-top:12px; border-collapse:collapse; background:#fff; border-radius:12px; overflow:hidden; }
    thead th{
      background:#f1f5ff; color:#1f2937; text-align:left; font-weight:700; padding:10px;
      border-bottom:1px solid #e5e7eb;
    }
    tbody td{ padding:10px; border-bottom:1px solid #f1f5f9; }
    tbody tr:nth-child(even){ background:#fafbff; }
    tbody tr:first-child td{ font-weight:700; }

    #log{
      white-space: pre-wrap; background:#fff; padding:12px; border-radius:12px;
      border:1px solid #eef2ff; color:var(--muted);
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .section {
      background: rgba(255,255,255,0.9);
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 16px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.03);
    }
    .section h2 {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent);
      margin: 0 0 12px 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .section h2::before { content: "🔹"; font-size: 16px; }

    .grades{ display:grid; gap:16px; grid-template-columns: 1fr; }
    @media (min-width: 980px){ .grades{ grid-template-columns: 1fr 1fr; } }

    /* 🌊 오른쪽 아래에 고정되는 홈 버튼 */
    .floating-home-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 52px;
      height: 52px;
      background: #3b82f6;
      color: #fff;
      font-size: 26px;
      text-align: center;
      line-height: 52px;
      border-radius: 50%;
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
      text-decoration: none;
      transition: all 0.2s ease;
      z-index: 999;
    }
    .floating-home-btn:hover {
      background: #2563eb;
      transform: translateY(-2px) scale(1.05);
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
    }
  </style>
</head>

<body>
  <header style="text-align:center;font-size:18px;font-weight:600;color:#3b82f6;margin-bottom:12px;letter-spacing:0.5px;">
    🌱 Green-Sail 환경 챌린지 현황판
  </header>

  <div class="board">
    <h1>반별 현황판 📊</h1>

    <!-- 🔍 데이터 필터 구역 -->
    <div class="section">
      <h2>데이터 필터</h2>

      <!-- ✅ A. 보기 모드 (하루/누적) -->
      <div class="actions" id="modeBar" style="gap:8px; flex-wrap:wrap; align-items:center">
        <strong style="margin-right:4px;">보기 모드:</strong>
        <label><input type="radio" name="mode" value="cumulative" id="modeCumulative" checked> 누적</label>
        <label><input type="radio" name="mode" value="daily" id="modeDaily"> 하루</label>

        <!-- 하루 보기 전용 -->
        <span id="dailyInputs" style="display:none; gap:8px; align-items:center">
          <label>날짜 <input id="viewDate" type="date" /></label>
          <button id="btnToday" type="button">오늘</button>
        </span>

        <!-- 누적(빠른 기간) 전용 -->
       <span id="quickRange" style="display:inline-flex; gap:8px; align-items:center">
  <button id="btnAll" type="button">전체</button>
</span>


        <input id="filterClass" placeholder="반 (예: 1-3, 2-1 / 비우면 전체)" />
        <button id="btnApplyMode" type="button">이 모드로 적용</button>
      </div>

      <!-- ✅ B. 직접 기간 지정 (A와 완전 별개) -->
      <div class="actions" id="customBar" style="gap:8px; flex-wrap:wrap; align-items:center; margin-top:8px;">
        <strong style="margin-right:4px;">기간 선택:</strong>
        <label>시작 <input id="startCustom" type="date" /></label>
        <label>끝   <input id="endCustom"   type="date" /></label>
        <button id="btnApplyCustom" type="button">선택한 기간으로 적용</button>
        <button id="btnClearCustom" type="button">지우기</button>
      </div>
    </div>

    <!-- 📊 1·2학년 차트 & 순위 (좌우 분리) -->
    <div class="grades">
      <!-- 1학년 -->
      <div class="section">
        <h2>📈 1학년 반별 참여도</h2>
        <canvas id="chart1" width="520" height="320"></canvas>
        <h3 style="margin-top:12px;">1학년 순위</h3>
        <table id="rank1">
          <thead><tr><th>순위</th><th>반</th><th>합계</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>

      <!-- 2학년 -->
      <div class="section">
        <h2>📈 2학년 반별 참여도</h2>
        <canvas id="chart2" width="520" height="320"></canvas>
        <h3 style="margin-top:12px;">2학년 순위</h3>
        <table id="rank2">
          <thead><tr><th>순위</th><th>반</th><th>합계</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>


  </div>

  <!-- 🏠 플로팅 홈 버튼 -->
  <a href="https://ubin128.github.io/green-sail/" class="floating-home-btn" title="홈으로 가기">홈</a>

  <script type="module">
    // 🔗 Firestore 조회 함수만 사용
    import { getRecordsByRangeAndClass } from './app-firebase.js';

    /* ========== 공용 유틸 & 로그 ========== */
    const todayStr = () => new Date().toISOString().slice(0,10);
    const log = (...a)=>{
      const e=document.getElementById('log');
      if (e) e.textContent=a.map(x=>typeof x==='object'?JSON.stringify(x,null,2):String(x)).join('\n');
      console.log(...a);
    };

    /* ========== 값 라벨 플러그인(툴팁 겹침 방지) ========== */
    const valueLabelPlugin = {
      id: 'valueLabel',
      afterDatasetsDraw(chart) {
        const { ctx, scales } = chart;
        const ds = chart.data.datasets[0];
        const meta = chart.getDatasetMeta(0);
        if (!ds || !meta) return;
        const baseY = scales.y?.getPixelForValue ? scales.y.getPixelForValue(0) : null;
        ctx.save();
        meta.data.forEach((bar, i) => {
          const v = ds.data[i];
          if (v == null || !bar) return;
          const bh = (baseY != null) ? (baseY - bar.y) : 0;
          const x = bar.x, y = bh >= 24 ? bar.y + 14 : bar.y - 10;
          ctx.font = '12px system-ui';
          ctx.textAlign = 'center';
          ctx.fillStyle = bh >= 24 ? '#fff' : '#333';
          ctx.fillText(String(v), x, y);
        });
        ctx.restore();
      }
    };
    Chart.register(valueLabelPlugin);

    /* ========== 차트 2개 초기화 ========== */
    const chart1 = new Chart(document.getElementById('chart1').getContext('2d'), {
      type:'bar',
      data:{ labels:[], datasets:[{ label:'1학년 합계', data:[], borderWidth:2 }]},
      options:{
        responsive:true,
        layout:{ padding:{ top:24 }},
        plugins:{ legend:{ display:false }, title:{ display:true, text:'1학년 반별 합계' }},
        scales:{ y:{ beginAtZero:true, ticks:{ stepSize:1 }}}
      }
    });
    const chart2 = new Chart(document.getElementById('chart2').getContext('2d'), {
      type:'bar',
      data:{ labels:[], datasets:[{ label:'2학년 합계', data:[], borderWidth:2 }]},
      options:{
        responsive:true,
        layout:{ padding:{ top:24 }},
        plugins:{ legend:{ display:false }, title:{ display:true, text:'2학년 반별 합계' }},
        scales:{ y:{ beginAtZero:true, ticks:{ stepSize:1 }}}
      }
    });

    /* ========== Top3 강조 + 차트 갱신 ========== */
    function paintTop3(chart, labels, values){
      const s = values.map(v=>Number(v)||0);
      const order = s.map((v,i)=>({v,i})).sort((a,b)=>b.v-a.v);
      const top = order.slice(0,3).map(x=>x.i);
      const bg = s.map((v,i)=> i===top[0] ? 'rgba(255,205,86,0.7)'
                        : i===top[1] ? 'rgba(201,203,207,0.7)'
                        : i===top[2] ? 'rgba(205,127,50,0.7)'
                        : 'rgba(54,162,235,0.5)');
      const bd = s.map((v,i)=> i===top[0] ? 'rgba(255,159,64,1)'
                        : i===top[1] ? 'rgba(128,128,128,1)'
                        : i===top[2] ? 'rgba(139,69,19,1)'
                        : 'rgba(54,162,235,1)');
      chart.data.labels = labels;
      chart.data.datasets[0].data = s;
      chart.data.datasets[0].backgroundColor = bg;
      chart.data.datasets[0].borderColor = bd;
      chart.update();
    }

    /* ========== 반별 합산 (totalKg 있으면 사용, 없으면 튜플 합계) ========== */
    function groupByClass(records){
      const by = {};
      for (const r of records){
        const c = r.class || '미지정';
        const fallback = (r.tumbler||0)+(r.lightOff||0)+(r.zeroWaste||0);
        const val = r.totalKg!=null ? Number(r.totalKg) : fallback; // ← 안전한 합산
        by[c] = (by[c] || 0) + val;
      }
      const sorted = Object.entries(by).sort((a,b)=>b[1]-a[1]);
      // 소수 2자리 반올림 (표시 깔끔)
      const entries = sorted.map(([cls,total]) => [cls, Number(total.toFixed(2))]);
      return { labels: entries.map(x=>x[0]), values: entries.map(x=>x[1]), entries };
    }

    /* ========== 1·2학년 분리 렌더 ========== */
    function renderSeparated(records){
      const first  = records.filter(r => (r.class||'').startsWith('1-'));
      const second = records.filter(r => (r.class||'').startsWith('2-'));
      const g1 = groupByClass(first);
      const g2 = groupByClass(second);
      paintTop3(chart1, g1.labels, g1.values);
      paintTop3(chart2, g2.labels, g2.values);
      const drawRank = (tbodySel, entries)=>{
        const tb = document.querySelector(tbodySel);
        tb.innerHTML = entries.length===0
          ? `<tr><td colspan="3" style="text-align:center;color:#888;">데이터가 없습니다</td></tr>`
          : entries.map(([cls,total],i)=>{
              const badge = i===0 ? '🥇' : i===1 ? '🥈' : i===2 ? '🥉' : (i+1);
              return `<tr><td>${badge}</td><td>${cls}</td><td>${total}</td></tr>`;
            }).join('');
      };
      drawRank('#rank1 tbody', g1.entries);
      drawRank('#rank2 tbody', g2.entries);
    }

    /* ========== 보기 모드 UI / 적용 로직 분리 ========== */
    const getViewMode = () => document.getElementById('modeDaily').checked ? 'daily' : 'cumulative';
    function updateFilterUI(){
      const daily  = document.getElementById('dailyInputs');
      const quick  = document.getElementById('quickRange');
      if (getViewMode()==='daily'){
        daily.style.display = 'inline-flex';
        quick.style.display = 'none';
      }else{
        daily.style.display = 'none';
        quick.style.display = 'inline-flex';
      }
    }

    // 마지막 적용 기준(자동 새로고침용)
    let lastCriteria = { start: undefined, end: undefined, cls: 'ALL' };

    async function applyWith({ start, end, cls }){
      try{
        const records = await getRecordsByRangeAndClass({ startDate:start, endDate:end, cls });
        log('🔎 적용 기준:', { start, end, cls, count: records.length });
        renderSeparated(records);
        lastCriteria = { start, end, cls };
      }catch(e){
        console.error(e);
        alert('필터 적용 실패: ' + (e.code || e.message));
      }
    }

    // A. 보기 모드 제어
    document.getElementById('modeDaily').addEventListener('change', updateFilterUI);
    document.getElementById('modeCumulative').addEventListener('change', updateFilterUI);

    document.getElementById('btnToday').onclick = () => {
      document.getElementById('modeDaily').checked = true;
      updateFilterUI();
      document.getElementById('viewDate').value = todayStr();
    };

    document.getElementById('btnThisWeek').onclick = () => {
      document.getElementById('modeCumulative').checked = true;
      updateFilterUI();
      const n=new Date(), m=new Date(n);
      m.setDate(n.getDate()-(n.getDay()+6)%7);
      const s = m.toISOString().slice(0,10);
      const e = new Date(m.getFullYear(), m.getMonth(), m.getDate()+6).toISOString().slice(0,10);
      // dataset에 보관
      document.getElementById('modeCumulative').dataset.quickStart = s;
      document.getElementById('modeCumulative').dataset.quickEnd   = e;
    };

    document.getElementById('btnThisMonth').onclick = () => {
      document.getElementById('modeCumulative').checked = true;
      updateFilterUI();
      const n=new Date();
      const s=new Date(n.getFullYear(), n.getMonth(), 1).toISOString().slice(0,10);
      const e=new Date(n.getFullYear(), n.getMonth()+1, 0).toISOString().slice(0,10);
      document.getElementById('modeCumulative').dataset.quickStart = s;
      document.getElementById('modeCumulative').dataset.quickEnd   = e;
    };

    document.getElementById('btnAll').onclick = () => {
      document.getElementById('modeCumulative').checked = true;
      updateFilterUI();
      delete document.getElementById('modeCumulative').dataset.quickStart;
      delete document.getElementById('modeCumulative').dataset.quickEnd;
    };

    document.getElementById('btnApplyMode').onclick = () => {
      const cls = (document.getElementById('filterClass').value || '').trim() || 'ALL';
      if (getViewMode()==='daily'){
        const day = document.getElementById('viewDate').value || todayStr();
        applyWith({ start: day, end: day, cls });
      } else {
        const s = document.getElementById('modeCumulative').dataset.quickStart;
        const e = document.getElementById('modeCumulative').dataset.quickEnd;
        applyWith({ start: s, end: e, cls });
      }
    };

    // B. 직접 기간 지정
    document.getElementById('btnApplyCustom').onclick = () => {
      const s = document.getElementById('startCustom').value || undefined;
      const e = document.getElementById('endCustom').value   || undefined;
      const cls = (document.getElementById('filterClass').value || '').trim() || 'ALL';
      applyWith({ start: s, end: e, cls });
    };
    document.getElementById('btnClearCustom').onclick = () => {
      document.getElementById('startCustom').value = '';
      document.getElementById('endCustom').value   = '';
    };

    // 자동 새로고침: 마지막 기준 그대로
    setInterval(() => applyWith(lastCriteria), 15000);

    // 초기화
    updateFilterUI();
    applyWith({ start: undefined, end: undefined, cls: 'ALL' });
  </script>
</body>
</html>
